name: Build F-Linux ISO

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      T2_DIR: /mnt/work/t2sde
    defaults:
      run:
        working-directory: F-Linux-10.0-Independent-Aero-Horizon
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén project.zip
        working-directory: .
        run: |
          unzip -q project.zip
          ls -la F-Linux-10.0-Independent-Aero-Horizon

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          sudo mkdir -p /mnt/work && sudo chown "$USER":"$USER" /mnt/work
          df -h / /mnt

      - name: Install build dependencies
        run: bash scripts/install-ubuntu-build-deps.sh

      - name: Clone T2
        run: |
          git clone --depth 1 https://github.com/rxrbln/t2sde.git "$T2_DIR"
          git -C "$T2_DIR" fetch --shallow-since="$(date -d '300 days ago' +%F)" origin || true
          git -C "$T2_DIR" log --oneline -3

      - name: Chọn bản T2 build được luabash
        working-directory: /mnt/work/t2sde
        run: |
          set +e
          ok=0
          for d in 0 14 30 60 90 150 240; do
            if [ "$d" = 0 ]; then c="$(git rev-parse origin/HEAD)"; else c="$(git rev-list -1 --before="$d days ago" origin/HEAD)"; fi
            [ -n "$c" ] || continue
            echo "===== Thử T2 cách đây $d ngày: $c ====="
            sudo git clean -fdxq
            git checkout -q -f "$c"
            git submodule update --init --recursive 2>&1 | tail -n 3
            sudo timeout 180 ./t2 config -cfg luatest -oldconfig < /dev/null > /tmp/luatest.log 2>&1
            tail -n 6 /tmp/luatest.log
            if ls src/bash/luabash.* >/dev/null 2>&1; then
              echo ">>> luabash build được ở bản này ($d ngày trước)"
              ok=1
              break
            fi
          done
          sudo rm -rf config/luatest
          if [ "$ok" != 1 ]; then
            echo 'Không bản T2 nào build được luabash.'
            echo '--- Config: các dòng liên quan ---'
            grep -n 'luabash' scripts/Config | head -20
            echo '--- Makefile luabash ---'
            sed -n 1,30p misc/luabash/Makefile
            ls -la misc/luabash misc/luabash/bash 2>&1 | head -40
            exit 1
          fi
          git log -1 --format='T2 đang dùng: %H %cd'

      - name: Bootstrap T2 and install the flinux target
        run: bash scripts/bootstrap-t2.sh

      - name: Bỏ các gói nặng để build kịp giờ
        working-directory: /mnt/work/t2sde
        run: |
          tpl="$(sed -n 's/^include //p' target/flinux/pkgsel | head -n1)"
          echo "Template: $tpl"
          for f in "$tpl" target/flinux/pkgsel config/flinux/pkgsel; do
            [ -f "$f" ] && sed -i -E '/^X (firefox|thunderbird|libreoffice[^ ]*|chromium|gimp|inkscape|vlc|qemu|mpv|ffmpeg|pipewire|pulseaudio|bluez|blueman|ibus|ibus-typing-booster|m17n-db|m17n-lib|mousepad|ristretto|tumbler|gvfs|noto-emoji-fonts|cantarell-fonts)[[:space:]]*$/d' "$f"
          done
          echo '--- target/flinux/pkgsel ---'; cat target/flinux/pkgsel
          echo '--- config/flinux/pkgsel ---'; cat config/flinux/pkgsel || true

      - name: T2 config (không cần bấm menu)
        working-directory: /mnt/work/t2sde
        run: |
          set +e
          mkdir -p config/flinux
          cat >> config/flinux/config <<'CFG'
          SDECFG_TARGET='flinux'
          SDECFG_ARCH='x86-64'
          SDECFG_PKGFILE_TYPE='tar.zst'
          CFG
          sudo timeout 600 ./t2 config -cfg flinux -oldconfig < /dev/null 2>&1 | tail -n 40
          ls -la config/flinux/
          if [ ! -s config/flinux/packages ]; then
            echo '===== DIAGNOSE ====='
            echo '--- Config: các dòng liên quan tới oldconfig/packages ---'
            grep -n -e oldconfig -e 'Create-PkgList' -e 'packages' scripts/Config | head -40
            echo '--- thử tạo danh sách gói trực tiếp ---'
            ls scripts | grep -i -e pkg -e list | head
            sudo ./scripts/Create-PkgList -cfg flinux 2>&1 | tail -n 20
            ls -la config/flinux/
          fi
          if [ ! -s config/flinux/packages ]; then
            echo 'T2 config không tạo được config/flinux/packages'
            exit 1
          fi
          echo "Số gói được chọn: $(grep -c '^X' config/flinux/packages)"

      - name: Download sources
        timeout-minutes: 30
        working-directory: /mnt/work/t2sde
        run: sudo ./t2 download -cfg flinux -required 2>&1 | tee /mnt/work/download.log

      - name: Build target from source
        timeout-minutes: 295
        working-directory: /mnt/work/t2sde
        run: sudo ./t2 build-target -cfg flinux 2>&1 | tee /mnt/work/build.log

      - name: Create live ISO
        timeout-minutes: 15
        working-directory: /mnt/work/t2sde
        run: |
          sudo ./t2 create-iso F-Linux-10.0-Aero-Horizon-amd64 flinux 2>&1 | tee /mnt/work/iso.log
          mkdir -p /mnt/work/dist
          sudo cp F-Linux-10.0-Aero-Horizon-amd64*.iso /mnt/work/dist/
          cd /mnt/work/dist && sudo sha256sum *.iso | sudo tee SHA256SUMS
          ls -lh /mnt/work/dist

      - name: Collect error logs
        if: always()
        working-directory: /mnt/work/t2sde
        run: |
          mkdir -p /mnt/work/logs
          cp /mnt/work/*.log /mnt/work/logs/ 2>/dev/null || true
          sudo ./t2 list-errors > /mnt/work/logs/list-errors.txt 2>&1 || true
          tail -n 300 /mnt/work/build.log > /mnt/work/logs/build-tail.txt 2>/dev/null || true
          sudo chmod -R a+r /mnt/work/logs
          df -h / /mnt > /mnt/work/logs/disk.txt

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: F-Linux-ISO
          path: /mnt/work/dist/*
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /mnt/work/logs/*
          retention-days: 14
